[project]
name = "yolo-media-organizer"
version = "0.6.1"
description = "Index images and video snapshots with YOLO and move media into label folders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.120",
    "opencv-python>=4.10",
    "pillow>=10",
    "platformdirs>=4",
    "huggingface-hub>=0.27",
    "dill>=0.4.1",
    "pydantic>=2,<3",
]

[project.scripts]
yolo-media-organizer = "app.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = ["pytest>=8", "ruff>=0.16.7"]
gpu = [
    "torch",
    "torchvision",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", group = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", group = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
