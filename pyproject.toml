[project]
name = "yolo-media-organizer"
version = "0.7.2"
description = "Index images and video snapshots with YOLO and move media into label folders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.120",
    "opencv-python>=4.10",
    "pillow>=10",
    "platformdirs>=4",
    "huggingface-hub>=1.31.0",
    "tqdm>=4.67",
    "dill>=0.4.1",
    "pydantic>=2,<3",
]

[project.scripts]
yolo-media-organizer = "app.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "assets"]

[tool.setuptools.package-data]
assets = ["Ymo.ico"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.7"]
cpu = [
    "torch",
    "torchvision",
]
gpu = [
    "torch",
    "torchvision",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu130", group = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu130", group = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
