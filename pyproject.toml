[project]
name = "yolo-media-sorter"
version = "0.0.5"
description = "Index images and video snapshots with YOLO and move media into label folders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.120",
    "opencv-python>=4.10",
    "pillow>=10",
    "platformdirs>=4",
    "huggingface-hub>=0.27",
    "dill>=0.4.1",
    "pydantic>=2,<3",
]

[project.scripts]
yolo-media-sorter = "app.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
